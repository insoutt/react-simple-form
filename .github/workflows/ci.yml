name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (React ${{ matrix.react }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        react: [18, 19]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install

      - name: Use React 19
        if: matrix.react == 19
        run: yarn add --dev react@^19 react-dom@^19 @types/react@^19 react-hook-form@^7.52.0

      - name: Run CI
        run: yarn ci
